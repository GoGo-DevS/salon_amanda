services:
  - type: web
    name: salon-amanda
    env: python
    # free DE VERDAD, medido en el panel de Render el 05-10-2026: plan Free $0,
    # sin disco (free no los permite) y sin DATABASE_URL, o sea SQLite dentro
    # del contenedor. Consecuencia: todo lo que Sergio cargue desde su panel
    # --promociones incluidas-- se borra en el siguiente despliegue.
    # Mover las fotos a R2 NO alcanza por si solo: la foto sobrevive pero la
    # fila de la promo no, y queda un archivo huerfano. Para que su panel sirva
    # hace falta ademas una base que persista (Postgres), no solo storage.
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py importar_productos && python manage.py ensure_superuser
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: GA4_MEASUREMENT_ID
        sync: false   # el G-XXXXXXXXXX de Google Analytics. VACIO = el sitio no mide ni llama a Google
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

      # Las fotos que Sergio sube desde su panel (promociones). R2 gana sobre
      # Cloudinary porque Cloudinary cobra por SERVIR: la cuenta se agota justo
      # cuando al cliente le va bien. Se exigen las CUATRO -- con el bucket
      # puesto y el account id vacio, boto3 revienta y el sitio cae con 502.
      # ORDEN: correr "manage.py migrar_media_r2 --confirmar" ANTES de poner
      # estas variables. Al reves, el sitio le pide las fotos a un bucket vacio.
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false   # pub-xxxx.r2.dev, SIN https://
      - key: CLOUDINARY_URL
        sync: false   # queda de respaldo; si R2 esta completo, no se usa
