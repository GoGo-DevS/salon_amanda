<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salón Amanda — Links</title>
  <meta name="description" content="Todos los links de Salón Amanda — Agenda, WhatsApp, Instagram y más.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #00BFC8;
      --gold: #C9A84C;
      --bg: #0a0a0a;
      --card: #141414;
      --border: rgba(0,191,200,0.18);
      --text: #f5f5f5;
      --muted: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 40px;
    }

    .logo-wrap {
      margin-bottom: 20px;
    }
    .logo-wrap img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 50%;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.04em;
    }
    .tagline {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
      margin-bottom: 36px;
    }

    .links {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      text-decoration: none;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }
    .link-btn:hover {
      border-color: var(--teal);
      background: rgba(0,191,200,0.07);
      transform: translateY(-2px);
    }
    .link-btn .icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
    }
    .icon-agenda  { background: rgba(0,191,200,0.15); }
    .icon-wa      { background: rgba(37,211,102,0.15); }
    .icon-ig      { background: rgba(201,168,76,0.15); }
    .icon-web     { background: rgba(255,255,255,0.07); }

    .link-btn .label { flex: 1; }
    .link-btn .label small {
      display: block;
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .link-btn .arrow {
      color: var(--teal);
      font-size: 1.1rem;
      opacity: 0.7;
    }

    .footer {
      margin-top: 44px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .footer a {
      color: var(--teal);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    {% load static %}
    <img src="{% static 'img/logo-amanda.png' %}" alt="Salón Amanda">
  </div>

  <p class="name">Salón Amanda</p>
  <p class="tagline">Estudio de belleza · CDValles, Santiago</p>

  <nav class="links">

    <a class="link-btn" href="https://link.agendapro.com/cl/salonamanda/9581b2de" target="_blank" rel="noopener">
      <span class="icon icon-agenda">📅</span>
      <span class="label">
        Agenda tu hora
        <small>Reserva online · Sin esperar</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="https://wa.me/56939308418?text=Hola%20Sal%C3%B3n%20Amanda%2C%20quiero%20consultar%20por%20sus%20servicios" target="_blank" rel="noopener">
      <span class="icon icon-wa">💬</span>
      <span class="label">
        WhatsApp
        <small>Respuesta directa</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="https://instagram.com/salonamanda" target="_blank" rel="noopener">
      <span class="icon icon-ig">📸</span>
      <span class="label">
        Instagram
        <small>@salonamanda</small>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="link-btn" href="https://salonamanda.cl" target="_blank" rel="noopener">
      <span class="icon icon-web">🌐</span>
      <span class="label">
        Sitio web
        <small>salonamanda.cl</small>
      </span>
      <span class="arrow">›</span>
    </a>

  </nav>

  <p class="footer">
    Web por <a href="https://gogodevs.cl" target="_blank">GoGoDevS</a>
  </p>

</body>
</html>
