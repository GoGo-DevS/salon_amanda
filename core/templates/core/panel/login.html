<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Salón Amanda</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body {
    background: #0d0d0d;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
  }
  .login-wrap {
    width: 100%;
    max-width: 400px;
    padding: 1rem;
  }
  .login-logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .login-logo .icon {
    width: 64px; height: 64px;
    background: rgba(0,191,200,.12);
    border: 1px solid rgba(0,191,200,.3);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 1.8rem;
    color: #00BFC8;
  }
  .login-logo h1 {
    font-size: 1.5rem; font-weight: 800; color: #fff; margin: 0 0 .2rem;
    letter-spacing: -.02em;
  }
  .login-logo p { color: #666; font-size: .85rem; margin: 0; }
  .login-card {
    background: #161616;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    padding: 2rem;
  }
  .form-label { color: #bbb; font-size: .85rem; font-weight: 600; }
  .form-control {
    background: #1e1e1e; border: 1px solid rgba(255,255,255,.1);
    color: #e8e8e8; border-radius: 10px; padding: 12px 14px;
  }
  .form-control:focus {
    background: #1e1e1e; border-color: #00BFC8; color: #e8e8e8;
    box-shadow: 0 0 0 3px rgba(0,191,200,.15); outline: none;
  }
  .btn-login {
    width: 100%; background: #00BFC8; color: #0d0d0d;
    font-weight: 800; border: none; border-radius: 12px;
    padding: 13px; font-size: 1rem; cursor: pointer;
    transition: opacity .2s;
    margin-top: .5rem;
  }
  .btn-login:hover { opacity: .88; }
  .error-msg {
    background: rgba(238,0,85,.08);
    border: 1px solid rgba(238,0,85,.25);
    color: #f55; border-radius: 10px;
    padding: 10px 14px; font-size: .85rem; margin-bottom: 1rem;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="icon"><i class="bi bi-scissors"></i></div>
    <h1>Salón Amanda</h1>
    <p>Panel de administración</p>
  </div>
  <div class="login-card">
    {% if error %}
    <div class="error-msg"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
