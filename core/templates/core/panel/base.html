<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel — Salón Amanda{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root {
    --teal: #00BFC8;
    --gold: #C8A96E;
    --dark: #0d0d0d;
    --card: #161616;
    --border: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  body { background: var(--dark); color: #e8e8e8; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* NAV */
  .panel-nav {
    background: #111;
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .panel-nav .brand {
    display: flex; align-items: center; gap: .6rem;
    font-size: 1rem; font-weight: 700; color: #fff; text-decoration: none;
  }
  .panel-nav .brand span { color: var(--teal); }
  .panel-nav .logout-btn {
    background: none; border: 1px solid var(--border);
    color: #aaa; padding: 6px 14px; border-radius: 8px;
    font-size: .82rem; cursor: pointer; text-decoration: none;
    transition: border-color .2s, color .2s;
  }
  .panel-nav .logout-btn:hover { border-color: var(--teal); color: var(--teal); }

  /* CONTENIDO */
  .panel-body { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .panel-section-title {
    font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: .6rem;
  }
  .panel-section-title .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }

  /* CARDS */
  .promo-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    display: flex; align-items: flex-start; gap: 1rem;
    transition: border-color .2s;
  }
  .promo-card:hover { border-color: rgba(0,191,200,.25); }
  .promo-card.inactiva { opacity: .5; }
  .promo-titulo { font-weight: 700; color: #fff; font-size: 1rem; margin-bottom: .2rem; }
  .promo-desc { color: #999; font-size: .88rem; line-height: 1.5; }
  .promo-meta { font-size: .75rem; color: #666; margin-top: .4rem; }

  /* BADGE */
  .badge-activa { background: rgba(0,191,200,.15); color: var(--teal); border: 1px solid rgba(0,191,200,.3); font-size: .72rem; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 20px; }
  .badge-inactiva { background: rgba(255,255,255,.05); color: #666; border: 1px solid var(--border); font-size: .72rem; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 20px; }

  /* BTN */
  .btn-teal { background: var(--teal); color: #0d0d0d; font-weight: 700; border: none; border-radius: 10px; padding: 10px 22px; cursor: pointer; text-decoration: none; font-size: .9rem; display: inline-flex; align-items: center; gap: .4rem; transition: opacity .2s; }
  .btn-teal:hover { opacity: .85; color: #0d0d0d; }
  .btn-ghost { background: none; color: #aaa; border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; font-size: .85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: border-color .2s, color .2s; }
  .btn-ghost:hover { border-color: #aaa; color: #fff; }
  .btn-danger-ghost { background: none; color: #e05; border: 1px solid rgba(238,0,85,.25); border-radius: 10px; padding: 8px 16px; font-size: .85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; transition: border-color .2s; }
  .btn-danger-ghost:hover { border-color: #e05; }

  /* FORM */
  .panel-form { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
  .form-label { color: #bbb; font-size: .85rem; font-weight: 600; margin-bottom: .4rem; }
  .form-control, .form-select {
    background: #1e1e1e; border: 1px solid var(--border); color: #e8e8e8;
    border-radius: 10px; padding: 10px 14px;
  }
  .form-control:focus, .form-select:focus {
    background: #1e1e1e; border-color: var(--teal); color: #e8e8e8;
    box-shadow: 0 0 0 3px rgba(0,191,200,.15); outline: none;
  }
  textarea.form-control { min-height: 100px; resize: vertical; }
  .form-check-input:checked { background-color: var(--teal); border-color: var(--teal); }

  /* ALERT */
  .alert-success-panel { background: rgba(0,191,200,.1); border: 1px solid rgba(0,191,200,.3); color: var(--teal); border-radius: 10px; padding: 12px 16px; margin-bottom: 1.5rem; font-size: .9rem; }
  .alert-error-panel { background: rgba(238,0,85,.08); border: 1px solid rgba(238,0,85,.25); color: #f55; border-radius: 10px; padding: 12px 16px; margin-bottom: 1.5rem; font-size: .9rem; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 4rem 2rem; color: #555; }
  .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
</style>
</head>
<body>

<nav class="panel-nav">
  <a href="{% url 'panel_dashboard' %}" class="brand">
    <i class="bi bi-scissors" style="color:var(--teal);font-size:1.2rem;"></i>
    Salón <span>Amanda</span>&nbsp;<span style="color:#555;font-weight:400;font-size:.8rem;">Panel</span>
  </a>
  <a href="{% url 'panel_logout' %}" class="logout-btn">
    <i class="bi bi-box-arrow-right"></i> Salir
  </a>
</nav>

<div class="panel-body">
  {% if messages %}
    {% for msg in messages %}
      <div class="{% if msg.tags == 'error' %}alert-error-panel{% else %}alert-success-panel{% endif %}">
        <i class="bi {% if msg.tags == 'error' %}bi-exclamation-circle{% else %}bi-check-circle{% endif %}"></i>
        {{ msg }}
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
